name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact pubspec version, including build number (for example 1.0.0+1)
        required: true
        type: string

concurrency:
  group: android-release-${{ github.event_name == 'push' && github.ref_name || format('android-v{0}', inputs.version) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-android:
    name: Signed Personal and Robot APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    defaults:
      run:
        working-directory: mobile_app/dosey_app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release source policy
        run: bash ../../.github/scripts/check-android-release-source.sh

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Validate version and release tag
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(awk '/^version: / { print $2; exit }' pubspec.yaml)
          SOURCE_SHA=$(git rev-parse HEAD)
          if [ "$SOURCE_SHA" != "$GITHUB_SHA" ]; then
            echo "Checked-out source $SOURCE_SHA does not match workflow source $GITHUB_SHA." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#android-v}"
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "Pushed tag $TAG resolves to $TAG_SHA instead of built source $SOURCE_SHA." >&2
              exit 1
            fi
          else
            VERSION="$REQUESTED_VERSION"
            TAG="android-v$VERSION"
            EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
            if [ -z "$EXISTING" ]; then
              EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
            fi
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "$SOURCE_SHA" ]; then
              echo "Tag $TAG already points to another commit." >&2
              exit 1
            fi
          fi
          if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "Requested version $VERSION does not match pubspec version $PUBSPEC_VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/storage/dosey_database.g.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify runtime capability contracts
        run: |
          set -euo pipefail
          runtime_tests=(
            test/core/runtime/runtime_capability_test.dart
            test/core/runtime/runtime_bootstrap_test.dart
            test/core/runtime/local_runtime_capability_repository_test.dart
          )
          existing_tests=()
          missing_tests=()
          for test_path in "${runtime_tests[@]}"; do
            if [ -f "$test_path" ]; then
              existing_tests+=("$test_path")
            else
              missing_tests+=("$test_path")
            fi
          done
          if [ ${#existing_tests[@]} -eq 0 ]; then
            printf 'Runtime capability contract tests are not present; skipping this pre-runtime rollout gate.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ${#missing_tests[@]} -ne 0 ]; then
            printf 'Runtime capability contract tests are only partially present. Missing:\n' >&2
            printf '  %s\n' "${missing_tests[@]}" >&2
            exit 1
          fi
          printf 'Runtime capability contract tests are complete and covered by the full Flutter test suite.\n' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare public Appwrite configuration
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID: ${{ vars.APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID }}
          APPWRITE_CLAIM_ROBOT_FUNCTION_ID: ${{ vars.APPWRITE_CLAIM_ROBOT_FUNCTION_ID }}
          APPWRITE_CREATE_ROBOT_FUNCTION_ID: ${{ vars.APPWRITE_CREATE_ROBOT_FUNCTION_ID }}
          APPWRITE_CREATE_HOUSEHOLD_INVITATION_FUNCTION_ID: ${{ vars.APPWRITE_CREATE_HOUSEHOLD_INVITATION_FUNCTION_ID }}
          APPWRITE_ACCEPT_HOUSEHOLD_INVITATION_FUNCTION_ID: ${{ vars.APPWRITE_ACCEPT_HOUSEHOLD_INVITATION_FUNCTION_ID }}
          APPWRITE_REMOVE_HOUSEHOLD_MEMBER_FUNCTION_ID: ${{ vars.APPWRITE_REMOVE_HOUSEHOLD_MEMBER_FUNCTION_ID }}
          APPWRITE_GET_MOUNTED_ROBOT_FUNCTION_ID: ${{ vars.APPWRITE_GET_MOUNTED_ROBOT_FUNCTION_ID }}
        uses: ./.github/actions/prepare-appwrite-env

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done
          if [ "${ANDROID_KEY_ALIAS,,}" = "androiddebugkey" ]; then
            echo "The Android debug key alias is not allowed for releases." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dosey-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dosey-release.jks" >> "$GITHUB_ENV"

      - name: Reject debug signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          CERTIFICATE=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS")
          if printf '%s' "$CERTIFICATE" | grep -qi 'Android Debug'; then
            echo "Android Debug certificates are not allowed for releases." >&2
            exit 1
          fi

      - name: Build hardware-assisted Personal release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --flavor personal --dart-define-from-file=.env --dart-define=DOSEY_BUILD_PROFILE=personal --dart-define=DOSEY_RUNTIME_CAPABILITY=hardware-assisted --dart-define=CAREGIVER_SYNC_ENABLED=false

      - name: Build phone-only Robot release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --flavor robot --dart-define-from-file=.env --dart-define=DOSEY_BUILD_PROFILE=robot --dart-define=DOSEY_RUNTIME_CAPABILITY=phone-only --dart-define=CAREGIVER_SYNC_ENABLED=false

      - name: Verify APK signers and name artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner is unavailable." >&2
            exit 1
          fi
          EXPECTED=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          for flavor in personal robot; do
            APK="build/app/outputs/flutter-apk/app-$flavor-release.apk"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print tolower($2); exit}')
            if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Signer fingerprint mismatch for $flavor APK." >&2
              exit 1
            fi
          done
          cp build/app/outputs/flutter-apk/app-personal-release.apk "Dosey-Personal-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-robot-release.apk "Dosey-Robot-$VERSION.apk"
          sha256sum "Dosey-Personal-$VERSION.apk" "Dosey-Robot-$VERSION.apk" > "Dosey-Android-$VERSION-SHA256SUMS.txt"
          {
            printf '### Android release evidence\n\n'
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Signer SHA-256: `%s`\n\n' "$EXPECTED"
            printf '```text\n'
            cat "Dosey-Android-$VERSION-SHA256SUMS.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-android-release
          path: |
            mobile_app/dosey_app/Dosey-Personal-${{ steps.release.outputs.version }}.apk
            mobile_app/dosey_app/Dosey-Robot-${{ steps.release.outputs.version }}.apk
            mobile_app/dosey_app/Dosey-Android-${{ steps.release.outputs.version }}-SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary release files
        if: always()
        run: |
          rm -f .env "$RUNNER_TEMP/dosey-release.jks"

  publish-release:
    name: Publish GitHub release
    needs: release-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-android.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download signed release APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-android-release
          path: release-artifacts

      - name: Verify artifact checksums
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          sha256sum -c ./*-SHA256SUMS.txt

      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-android.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release-android.outputs.source_sha }}
        run: |
          set -euo pipefail
          CREATE_LOG="$RUNNER_TEMP/create-tag.log"
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            --raw-field "ref=refs/tags/$TAG" \
            --raw-field "sha=$EXPECTED_SOURCE_SHA" >/dev/null 2>"$CREATE_LOG"; then
            cat "$CREATE_LOG" >&2
            TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
            if [ -z "$TAG_SHA" ]; then
              TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
            fi
            if [ "$TAG_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
              echo "Tag $TAG could not be created at artifact source $EXPECTED_SOURCE_SHA." >&2
              exit 1
            fi
          fi
          TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          fi
          if [ "$TAG_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Tag $TAG resolves to $TAG_SHA instead of artifact source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.release-android.outputs.tag }}
          target_commitish: ${{ needs.release-android.outputs.source_sha }}
          name: Dosey Android ${{ needs.release-android.outputs.version }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*-SHA256SUMS.txt

      - name: Verify published tag matches artifact source
        env:
          TAG: ${{ needs.release-android.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release-android.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)
          if [ -z "$TAG_SHA" ]; then
            TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          fi
          if [ "$TAG_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Published tag $TAG resolves to $TAG_SHA instead of artifact source $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi
          printf -- '- Published tag `%s` verified at `%s`.\n' "$TAG" "$TAG_SHA" >> "$GITHUB_STEP_SUMMARY"
