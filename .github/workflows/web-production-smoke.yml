name: Web Production Smoke

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Check production web service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run production smoke check
        run: .github/scripts/check-web-production.sh

      - name: Summarize verification
        run: printf '### Web Production Smoke\n\n- Production smoke check passed.\n' >> "$GITHUB_STEP_SUMMARY"
