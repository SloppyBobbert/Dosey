name: Web Staging Sites

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Upload a prebuilt staging deployment, or explicitly activate an existing one
        required: true
        type: choice
        options:
          - upload
          - activate
        default: upload
      deployment_id:
        description: Required only for activate mode; never inferred from an upload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-staging-sites
  cancel-in-progress: false

env:
  APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
  APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
  APPWRITE_SITE_ID: ${{ vars.APPWRITE_STAGING_SITE_ID }}

jobs:
  upload:
    if: inputs.mode == 'upload'
    name: Upload staging deployment without activation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      APPWRITE_DEPLOYMENT_ENDPOINT: ${{ vars.APPWRITE_DEPLOYMENT_ENDPOINT }}
    defaults:
      run:
        working-directory: mobile_app/dosey_app
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build auth-enabled staging web release
        run: |
          flutter build web --release --target=lib/main_web.dart \
            --dart-define=DOSEY_BUILD_PROFILE=personal \
            --dart-define=WEB_AUTH_ENABLED=true \
            --dart-define=WEB_APP_ORIGIN=https://staging.dosey.dev \
            --dart-define=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --dart-define=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID"
      - name: Verify and archive web contents
        run: |
          set -euo pipefail
          build_dir="build/web"
          expected_symbols=(
            "canvaskit/canvaskit.js.symbols"
            "canvaskit/chromium/canvaskit.js.symbols"
            "canvaskit/experimental_webparagraph/canvaskit.js.symbols"
            "canvaskit/skwasm.js.symbols"
            "canvaskit/skwasm_heavy.js.symbols"
            "canvaskit/wimp.js.symbols"
          )
          for symbol in "${expected_symbols[@]}"; do
            test -f "$build_dir/$symbol" || {
              printf 'Expected web symbol file is missing: %s\n' "$symbol" >&2
              exit 1
            }
          done
          expected_symbols_file="$RUNNER_TEMP/staging-expected-symbols"
          actual_symbols_file="$RUNNER_TEMP/staging-actual-symbols"
          for symbol in "${expected_symbols[@]}"; do
            printf './%s\n' "$symbol"
          done | LC_ALL=C sort > "$expected_symbols_file"
          (cd "$build_dir" && find . -name '*.js.symbols' -print | LC_ALL=C sort) > "$actual_symbols_file"
          cmp -s "$expected_symbols_file" "$actual_symbols_file" || {
            printf 'Unexpected web symbol file set\n' >&2
            exit 1
          }
          if LC_ALL=C grep -R -I -n -F --exclude='*.js.symbols' -- '.js.symbols' "$build_dir"; then
            printf 'Retained web files reference .js.symbols\n' >&2
            exit 1
          else
            grep_exit=$?
            [ "$grep_exit" -eq 1 ] || exit "$grep_exit"
          fi
          required_files=(
            "index.html"
            "auth.html"
            "manifest.json"
            "main.dart.js"
            "flutter_bootstrap.js"
            "assets/NOTICES"
            "canvaskit/canvaskit.js"
            "canvaskit/canvaskit.wasm"
            "canvaskit/chromium/canvaskit.js"
            "canvaskit/chromium/canvaskit.wasm"
            "canvaskit/experimental_webparagraph/canvaskit.js"
            "canvaskit/experimental_webparagraph/canvaskit.wasm"
            "canvaskit/skwasm.js"
            "canvaskit/skwasm.wasm"
            "canvaskit/skwasm_heavy.js"
            "canvaskit/skwasm_heavy.wasm"
            "canvaskit/wimp.js"
            "canvaskit/wimp.wasm"
          )
          for required_file in "${required_files[@]}"; do
            test -s "$build_dir/$required_file" || {
              printf 'Required web file is missing or empty: %s\n' "$required_file" >&2
              exit 1
            }
          done
          expected_files="$RUNNER_TEMP/staging-expected-files"
          (cd "$build_dir" && find . -type f ! -name '*.js.symbols' -print | LC_ALL=C sort) > "$expected_files"
          tar --use-compress-program='gzip -9' --exclude='*.js.symbols' -cf "$GITHUB_WORKSPACE/dosey-web-staging.tar.gz" -C "$build_dir" .
          archive_files="$RUNNER_TEMP/staging-archive-files"
          tar -tzf "$GITHUB_WORKSPACE/dosey-web-staging.tar.gz" | grep -v '/$' | LC_ALL=C sort > "$archive_files"
          cmp -s "$expected_files" "$archive_files" || {
            printf 'Staging archive file set differs from build/web after symbol exclusion\n' >&2
            exit 1
          }
          if tar -tzf "$GITHUB_WORKSPACE/dosey-web-staging.tar.gz" | grep -F -- '.js.symbols'; then
            printf 'Staging archive contains a web symbol file\n' >&2
            exit 1
          fi
          archive_bytes="$(wc -c < "$GITHUB_WORKSPACE/dosey-web-staging.tar.gz")"
          printf 'Staging archive bytes: %s\n' "$archive_bytes"
          test "$archive_bytes" -lt 20000000 || {
            printf 'Staging archive exceeds 20,000,000 bytes\n' >&2
            exit 1
          }
      - name: Report archive byte size
        run: |
          printf 'Staging archive bytes: %s\n' "$(wc -c < "$GITHUB_WORKSPACE/dosey-web-staging.tar.gz")"
      - name: Upload staging archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-web-staging
          path: dosey-web-staging.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Create Appwrite staging deployment
        env:
          APPWRITE_SITES_API_KEY: ${{ secrets.APPWRITE_SITES_API_KEY }}
        run: |
          set -euo pipefail
          test "$APPWRITE_ENDPOINT" = "https://api.dosey.dev/v1" || {
            printf 'Unexpected Appwrite endpoint\n' >&2
            exit 1
          }
          test -n "$APPWRITE_ENDPOINT"; test -n "$APPWRITE_PROJECT_ID"; test -n "$APPWRITE_SITE_ID"; test -n "$APPWRITE_SITES_API_KEY"
          test "$APPWRITE_DEPLOYMENT_ENDPOINT" = "https://sfo.cloud.appwrite.io/v1" || {
            printf 'Unexpected Appwrite deployment endpoint\n' >&2
            exit 1
          }
          test -n "$APPWRITE_DEPLOYMENT_ENDPOINT"
          site_response="$GITHUB_WORKSPACE/staging-site-response.json"
          site_curl_exit=0
          site_status="$(curl --silent --show-error --output "$site_response" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 120 \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_SITES_API_KEY" \
            "$APPWRITE_DEPLOYMENT_ENDPOINT/sites/$APPWRITE_SITE_ID")" || site_curl_exit=$?
          if [ -f "$site_response" ]; then
            REDACTION_SECRET="$APPWRITE_SITES_API_KEY" python3 -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(os.environ["REDACTION_SECRET"], "[REDACTED]"))' "$site_response"
          fi
          [ "$site_curl_exit" -eq 0 ] || {
            printf 'Appwrite staging Site preflight failed before receiving an HTTP response\n' >&2
            exit 1
          }
          [ "$site_status" = 200 ] || {
            printf 'Appwrite staging Site preflight failed with HTTP %s\n' "$site_status" >&2
            exit 1
          }
          EXPECTED_SITE_ID="$APPWRITE_SITE_ID" ruby -rjson -e '
            begin
              data = JSON.parse(File.read(ARGV.fetch(0)))
            rescue JSON::ParserError, Errno::ENOENT
              abort "Appwrite staging Site preflight response is malformed"
            end
            abort "Appwrite staging Site preflight response is not an object" unless data.is_a?(Hash)
            abort "Appwrite staging Site preflight ID mismatch" unless data["$id"] == ENV.fetch("EXPECTED_SITE_ID")
          ' "$site_response"
          response="$GITHUB_WORKSPACE/staging-deployment-response.json"
          upload_exit=0
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 1800 \
            --request POST "$APPWRITE_DEPLOYMENT_ENDPOINT/sites/$APPWRITE_SITE_ID/deployments" \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_SITES_API_KEY" \
            --form "code=@$GITHUB_WORKSPACE/dosey-web-staging.tar.gz" \
            --form 'installCommand=' --form 'buildCommand=' --form 'outputDirectory=./' \
            --form 'activate=false')" || upload_exit=$?
          if [ -f "$response" ]; then
            REDACTION_SECRET="$APPWRITE_SITES_API_KEY" python3 -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(os.environ["REDACTION_SECRET"], "[REDACTED]"))' "$response"
          fi
          if [ "$upload_exit" -ne 0 ]; then
            printf 'Appwrite staging upload transport failed; deployment state is ambiguous; inspect Appwrite Sites before rerun\n' >&2
            exit 1
          fi
          if [ "$status" != 202 ]; then
            printf 'Appwrite staging upload returned HTTP %s; deployment state is ambiguous; inspect Appwrite Sites before rerun\n' "$status" >&2
            exit 1
          fi
          deployment_id="$(ruby -rjson -e '
            begin
              data = JSON.parse(File.read(ARGV.fetch(0)))
            rescue JSON::ParserError, Errno::ENOENT
              abort "Appwrite staging upload response is malformed; deployment state is ambiguous; inspect Appwrite Sites before rerun"
            end
            abort "Appwrite staging upload response is not an object; deployment state is ambiguous; inspect Appwrite Sites before rerun" unless data.is_a?(Hash)
            id = data["$id"]
            abort "Appwrite staging upload response has an invalid deployment ID; deployment state is ambiguous; inspect Appwrite Sites before rerun" unless id.is_a?(String) && id.match?(/\A[A-Za-z0-9][A-Za-z0-9._-]{0,35}\z/)
            puts id
          ' "$response")"
          printf 'Created staging deployment: %s\n' "$deployment_id"
          state=""
          for attempt in $(seq 1 30); do
            poll="$GITHUB_WORKSPACE/staging-deployment-status.json"
            poll_exit=0
            poll_status="$(curl --silent --show-error --output "$poll" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 120 \
              --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
              --header "X-Appwrite-Key: $APPWRITE_SITES_API_KEY" \
              "$APPWRITE_DEPLOYMENT_ENDPOINT/sites/$APPWRITE_SITE_ID/deployments/$deployment_id")" || poll_exit=$?
            if [ -f "$poll" ]; then
              REDACTION_SECRET="$APPWRITE_SITES_API_KEY" python3 -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(os.environ["REDACTION_SECRET"], "[REDACTED]"))' "$poll"
            fi
            if [ "$poll_exit" -ne 0 ]; then
              printf 'Transient staging status poll failure (%s/30); retrying\n' "$attempt" >&2
              sleep 10
              continue
            fi
            if [ "${poll_status#2}" = "$poll_status" ]; then
              printf 'Transient staging status poll HTTP %s (%s/30); retrying\n' "$poll_status" "$attempt" >&2
              sleep 10
              continue
            fi
            state="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); print(data.get("status", "") if isinstance(data, dict) else "")' "$poll")" || {
              printf 'Transient staging status poll JSON failure (%s/30); retrying\n' "$attempt" >&2
              sleep 10
              continue
            }
            if [ -z "$state" ]; then
              printf 'Transient staging status poll missing status (%s/30); retrying\n' "$attempt" >&2
              sleep 10
              continue
            fi
            printf 'Deployment status (%s/30): %s\n' "$attempt" "$state"
            case "$state" in
              ready) break ;;
              failed|canceled|cancelled) printf 'Staging deployment ended in %s\n' "$state" >&2; exit 1 ;;
            esac
            sleep 10
          done
          [ "$state" = ready ] || { printf 'Staging deployment did not become ready within the polling window\n' >&2; exit 1; }
          printf 'Upload complete. Do not activate until a human verifies prebuilt serving, auth.html, and upload limits.\n'
      - name: Preserve Appwrite response
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-web-staging-response
          path: |
            ${{ github.workspace }}/staging-deployment-response.json
            ${{ github.workspace }}/staging-deployment-status.json
            ${{ github.workspace }}/staging-site-response.json
          if-no-files-found: warn
          retention-days: 14

  activate:
    if: inputs.mode == 'activate'
    name: Explicitly activate staging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APPWRITE_DEPLOYMENT_ENDPOINT: ${{ vars.APPWRITE_DEPLOYMENT_ENDPOINT }}
    steps:
      - name: Validate explicit deployment ID
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            printf 'deployment_id has an invalid format\n' >&2
            exit 1
          }
      - name: Verify selected staging deployment is ready
        env:
          APPWRITE_SITES_API_KEY: ${{ secrets.APPWRITE_SITES_API_KEY }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          test "$APPWRITE_ENDPOINT" = "https://api.dosey.dev/v1" || {
            printf 'Unexpected Appwrite endpoint\n' >&2
            exit 1
          }
          test "$APPWRITE_DEPLOYMENT_ENDPOINT" = "https://sfo.cloud.appwrite.io/v1" || {
            printf 'Unexpected Appwrite deployment endpoint\n' >&2
            exit 1
          }
          test -n "$APPWRITE_DEPLOYMENT_ENDPOINT"
          [[ "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            printf 'deployment_id has an invalid format\n' >&2
            exit 1
          }
          response="$RUNNER_TEMP/staging-selected-deployment.json"
          curl_exit=0
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 120 \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_SITES_API_KEY" \
            "$APPWRITE_DEPLOYMENT_ENDPOINT/sites/$APPWRITE_SITE_ID/deployments/$DEPLOYMENT_ID")" || curl_exit=$?
          if [ -f "$response" ]; then
            REDACTION_SECRET="$APPWRITE_SITES_API_KEY" python3 -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(os.environ["REDACTION_SECRET"], "[REDACTED]"))' "$response"
          fi
          [ "$curl_exit" -eq 0 ] || {
            printf 'Staging deployment readiness lookup failed before receiving an HTTP response\n' >&2
            exit 1
          }
          [ "$status" = 200 ] || {
            printf 'Staging deployment readiness lookup failed with HTTP %s\n' "$status" >&2
            exit 1
          }
          EXPECTED_DEPLOYMENT_ID="$DEPLOYMENT_ID" ruby -rjson -e '
            begin
              data = JSON.parse(File.read(ARGV.fetch(0)))
            rescue JSON::ParserError, Errno::ENOENT
              abort "Staging deployment readiness response is malformed"
            end
            abort "Staging deployment readiness response is not an object" unless data.is_a?(Hash)
            abort "Staging deployment ID mismatch" unless data["$id"] == ENV.fetch("EXPECTED_DEPLOYMENT_ID")
            abort "Staging deployment is not ready" unless data["status"] == "ready"
          ' "$response"
      - name: Activate selected staging deployment
        env:
          APPWRITE_SITES_API_KEY: ${{ secrets.APPWRITE_SITES_API_KEY }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          test "$APPWRITE_ENDPOINT" = "https://api.dosey.dev/v1" || {
            printf 'Unexpected Appwrite endpoint\n' >&2
            exit 1
          }
          test "$APPWRITE_DEPLOYMENT_ENDPOINT" = "https://sfo.cloud.appwrite.io/v1" || {
            printf 'Unexpected Appwrite deployment endpoint\n' >&2
            exit 1
          }
          [[ "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            printf 'deployment_id has an invalid format\n' >&2
            exit 1
          }
          response="$GITHUB_WORKSPACE/staging-activation-response.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 120 \
            --request PATCH "$APPWRITE_DEPLOYMENT_ENDPOINT/sites/$APPWRITE_SITE_ID/deployment" \
            --header "X-Appwrite-Project: $APPWRITE_PROJECT_ID" \
            --header "X-Appwrite-Key: $APPWRITE_SITES_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-raw "{\"deploymentId\":\"$DEPLOYMENT_ID\"}")"
          REDACTION_SECRET="$APPWRITE_SITES_API_KEY" python3 -c 'import os, pathlib, sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(os.environ["REDACTION_SECRET"], "[REDACTED]"))' "$response"
          [ "${status#2}" != "$status" ] || { printf 'Activation failed with HTTP %s\n' "$status" >&2; exit 1; }
      - name: Preserve activation response
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-web-staging-activation-response
          path: ${{ github.workspace }}/staging-activation-response.json
          if-no-files-found: warn
          retention-days: 14
