name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-mobile:
    name: Flutter format, analyze, test, Android flavors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app/dosey_app

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check committed whitespace
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare public Appwrite configuration
        uses: ./.github/actions/prepare-appwrite-env
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID: ${{ vars.APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID }}
          APPWRITE_CLAIM_ROBOT_FUNCTION_ID: ${{ vars.APPWRITE_CLAIM_ROBOT_FUNCTION_ID }}

      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/storage/dosey_database.g.dart

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Personal debug APK
        run: flutter build apk --debug --flavor personal --dart-define-from-file=.env --dart-define=DOSEY_BUILD_PROFILE=personal

      - name: Build Robot debug APK
        run: flutter build apk --debug --flavor robot --dart-define-from-file=.env --dart-define=DOSEY_BUILD_PROFILE=robot

      - name: Name Android artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-personal-debug.apk build/app/outputs/flutter-apk/dosey-personal-debug.apk
          cp build/app/outputs/flutter-apk/app-robot-debug.apk build/app/outputs/flutter-apk/dosey-robot-debug.apk

      - name: Upload Personal debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-personal-debug-apk
          path: mobile_app/dosey_app/build/app/outputs/flutter-apk/dosey-personal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Robot debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-robot-debug-apk
          path: mobile_app/dosey_app/build/app/outputs/flutter-apk/dosey-robot-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary configuration
        if: always()
        run: unlink .env 2>/dev/null || true

  flutter-ios:
    name: Flutter native iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app/dosey_app

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare public Appwrite configuration
        uses: ./.github/actions/prepare-appwrite-env
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID: ${{ vars.APPWRITE_CREATE_PAIRING_CODE_FUNCTION_ID }}
          APPWRITE_CLAIM_ROBOT_FUNCTION_ID: ${{ vars.APPWRITE_CLAIM_ROBOT_FUNCTION_ID }}

      - name: Build iOS debug app
        run: flutter build ios --debug --no-codesign --dart-define-from-file=.env --dart-define=DOSEY_BUILD_PROFILE=personal

      - name: Remove temporary configuration
        if: always()
        run: unlink .env 2>/dev/null || true
