name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-mobile:
    name: Flutter format, analyze, test, Android flavors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app/dosey_app

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check committed whitespace
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD~1..HEAD
          fi

      - name: Verify immutable Android release source policy
        run: bash ../../.github/scripts/check-android-release-source.sh

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate public Appwrite profiles
        run: dart run tool/appwrite_profile.dart validate --profile config/appwrite/offline.json

      - name: Verify generated Drift code
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/storage/dosey_database.g.dart

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Record Robot Face golden renderer provenance
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import platform
          import shutil
          from pathlib import Path

          sdk = Path(shutil.which('flutter')).resolve().parents[1]
          print('uname:', platform.uname())
          print('flutter_sdk:', sdk)
          version = json.loads((sdk / 'bin/cache/flutter.version.json').read_text())
          for key in ('flutterVersion', 'frameworkRevision', 'engineRevision',
                      'engineContentHash', 'dartSdkVersion'):
              print(f'{key}: {version.get(key, "missing")}')
          for relative in ('bin/internal/engine.version', 'bin/cache/engine.stamp'):
              path = sdk / relative
              print(f'{relative}: {path.read_text().strip() if path.is_file() else "missing"}')
          files = [sdk / 'bin/cache/artifacts/material_fonts' / name for name in
                   ('Roboto-Regular.ttf', 'MaterialIcons-Regular.otf')]
          files += sorted((sdk / 'bin/cache/artifacts/engine').glob('*/flutter_tester'))
          if len(files) == 2:
              print('flutter_tester: missing')
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else 'missing'
              print(f'sha256 {path.relative_to(sdk)}: {digest}')
          PY

      - name: Test
        run: flutter test

      - name: Upload Robot Face golden failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: robot-face-golden-failures
          path: mobile_app/dosey_app/test/features/robot_face/failures/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify runtime capability contracts
        run: |
          set -euo pipefail
          runtime_tests=(
            test/core/runtime/runtime_capability_test.dart
            test/core/runtime/runtime_bootstrap_test.dart
            test/core/runtime/local_runtime_capability_repository_test.dart
          )
          existing_tests=()
          missing_tests=()
          for test_path in "${runtime_tests[@]}"; do
            if [ -f "$test_path" ]; then
              existing_tests+=("$test_path")
            else
              missing_tests+=("$test_path")
            fi
          done
          if [ ${#existing_tests[@]} -eq 0 ]; then
            printf 'Runtime capability contract tests are not present; skipping this pre-runtime rollout gate.\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ${#missing_tests[@]} -ne 0 ]; then
            printf 'Runtime capability contract tests are only partially present. Missing:\n' >&2
            printf '  %s\n' "${missing_tests[@]}" >&2
            exit 1
          fi
          printf 'Runtime capability contract tests are complete and covered by the full Flutter test suite.\n' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build hardware-assisted Personal debug APK
        run: dart run tool/appwrite_profile.dart flutter --profile config/appwrite/offline.json --flavor personal -- build apk --debug

      - name: Build phone-only Robot debug APK
        run: dart run tool/appwrite_profile.dart flutter --profile config/appwrite/offline.json --flavor robot -- build apk --debug

      - name: Verify public Android configuration artifacts
        run: python3 ../../.github/scripts/verify_public_config_artifacts.py --android

      - name: Name Android artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-personal-debug.apk build/app/outputs/flutter-apk/dosey-personal-debug.apk
          cp build/app/outputs/flutter-apk/app-robot-debug.apk build/app/outputs/flutter-apk/dosey-robot-debug.apk

      - name: Upload Personal debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-personal-debug-apk
          path: mobile_app/dosey_app/build/app/outputs/flutter-apk/dosey-personal-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Robot debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dosey-robot-debug-apk
          path: mobile_app/dosey_app/build/app/outputs/flutter-apk/dosey-robot-debug.apk
          if-no-files-found: error
          retention-days: 7
