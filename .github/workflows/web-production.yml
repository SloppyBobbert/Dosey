name: Web Production Pages

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character current main SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-production-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        working-directory: mobile_app/dosey_app
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate selected main SHA
        id: validate-source
        working-directory: .
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA,,}"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            printf 'source_sha must be exactly 40 hexadecimal characters\n' >&2
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          checked_out_sha="$(git rev-parse HEAD)"
          origin_main_sha="$(git rev-parse refs/remotes/origin/main)"
          [[ "$checked_out_sha" == "$source_sha" ]] || {
            printf 'Checked-out HEAD does not match source_sha\n' >&2
            exit 1
          }
          [[ "$origin_main_sha" == "$source_sha" ]] || {
            printf 'source_sha is not the current origin/main SHA\n' >&2
            exit 1
          }
          printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate production web configuration
        run: |
          set -euo pipefail
          test "${APPWRITE_ENDPOINT:-}" = "https://api.dosey.dev/v1" || {
            printf 'Unexpected Appwrite endpoint\n' >&2
            exit 1
          }
          test -n "${APPWRITE_PROJECT_ID:-}" || {
            printf 'APPWRITE_PROJECT_ID is required\n' >&2
            exit 1
          }

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Test web and auth paths
        run: flutter test test/app/web test/core/auth

      - name: Build auth-enabled production web release
        run: |
          flutter build web --release --target=lib/main_web.dart \
            --dart-define=DOSEY_BUILD_PROFILE=personal \
            --dart-define=WEB_AUTH_ENABLED=true \
            --dart-define=WEB_APP_ORIGIN=https://dosey.dev \
            --dart-define=APPWRITE_ENDPOINT="$APPWRITE_ENDPOINT" \
            --dart-define=APPWRITE_PROJECT_ID="$APPWRITE_PROJECT_ID"

      - name: Verify web contents
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/auth.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/manifest.json
          if find build/web -name .env -print -quit | grep -q .; then
            printf 'Unexpected .env file in web artifact\n' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: mobile_app/dosey_app/build/web

      - name: Summarize selected source
        env:
          SELECTED_SOURCE_SHA: ${{ steps.validate-source.outputs.source_sha }}
        run: |
          printf '### Web Production Pages\n\n- Source SHA: `%s`\n' "$SELECTED_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production Pages site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Summarize deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '### Web Production Pages deployment\n\n- Page URL: %s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
