name: Appwrite Backend CI

on:
  pull_request:
    paths:
      - backend/appwrite/**
      - .github/workflows/appwrite-backend-ci.yml
  push:
    paths:
      - backend/appwrite/**
      - .github/workflows/appwrite-backend-ci.yml

permissions:
  contents: read

concurrency:
  group: appwrite-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appwrite-backend:
    name: Appwrite backend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/appwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/appwrite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
