[platformio]
src_dir = bringup
include_dir = include
test_dir = test

[env]
build_flags =
  -Iinclude

[xiao]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#9ba53b691fb007d9c1b8fd37600cc71d6702125a
board = seeed-xiao-esp32-c6
framework = arduino
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -std=gnu++17

[env:01_blink_serial]
extends = xiao
build_src_filter =
  -<*>
  +<01_blink_serial/main.cpp>

[env:02_digital_output]
extends = xiao
build_src_filter =
  -<*>
  +<02_digital_output/main.cpp>

[env:03_button_input]
extends = xiao
build_src_filter =
  -<*>
  +<03_button_input/main.cpp>

[env:04_pir_input]
extends = xiao
build_src_filter =
  -<*>
  +<04_pir_input/main.cpp>

[env:05_analog_input]
extends = xiao
build_src_filter =
  -<*>
  +<05_analog_input/main.cpp>

[env:06_i2c_scanner]
extends = xiao
build_src_filter =
  -<*>
  +<06_i2c_scanner/main.cpp>

[env:07_servo_sweep]
extends = xiao
build_src_filter =
  -<*>
  +<07_servo_sweep/main.cpp>

[env:08_serial_protocol]
extends = xiao
build_src_filter =
  -<*>
  +<08_serial_protocol/main.cpp>

[env:09_ble_protocol]
extends = xiao
build_src_filter =
  -<*>
  +<controller_baseline/main.cpp>

[env:controller_baseline]
extends = xiao
build_src_filter =
  -<*>
  +<controller_baseline/main.cpp>

[env:controller_debug]
extends = xiao
build_src_filter =
  -<*>
  +<controller_baseline/main.cpp>
build_flags =
  ${xiao.build_flags}
  -DDOSEY_DEBUG_AVAILABLE=1

[env:native_parser]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_PARSER

[env:native_state]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_STATE

[env:native_protocol]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_PROTOCOL

[env:native_protocol_debug]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_PROTOCOL
  -DDOSEY_TEST_PROTOCOL_DEBUG
  -DDOSEY_DEBUG_AVAILABLE=1

[env:native_config]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_CONFIG
  -DDOSEY_DIGITAL_OUTPUT_CONFIGURED=1
  -DDOSEY_DIGITAL_OUTPUT_PIN=2
  -DDOSEY_BUTTON_CONFIGURED=1
  -DDOSEY_BUTTON_PIN=3
  -DDOSEY_PIR_CONFIGURED=1
  -DDOSEY_PIR_PIN=4
  -DDOSEY_PIR_WAKE_ENABLED=1
  -DDOSEY_PIR_ACTIVE_HIGH=0
  -DDOSEY_ANALOG_INPUT_CONFIGURED=1
  -DDOSEY_ANALOG_INPUT_PIN=5
  -DDOSEY_I2C_CONFIGURED=1
  -DDOSEY_I2C_SDA_PIN=22
  -DDOSEY_I2C_SCL_PIN=23
  -DDOSEY_GROVE_DIAGNOSTICS_ENABLED=1
  -DDOSEY_SERVO_ENABLED=1
  -DDOSEY_SERVO_PIN=19

[env:native_config_defaults]
platform = native
test_framework = unity
test_filter = test_native
build_flags =
  ${env.build_flags}
  -std=c++17
  -DDOSEY_TEST_CONFIG_DEFAULTS
